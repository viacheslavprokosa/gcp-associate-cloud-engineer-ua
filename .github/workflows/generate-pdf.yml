name: Generate PDF Book

on:
    push:
        branches:
            - main
        paths-ignore:
            - "pdf-book/**"
            - ".agent/**"
            - ".github/workflows/**"

jobs:
    generate-pdf:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            # Cache APT packages
            - name: Cache APT packages
              uses: actions/cache@v4
              with:
                  path: |
                      /var/cache/apt/archives
                      /var/lib/apt/lists
                  key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/generate-pdf.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-apt-

            # Cache npm global packages
            - name: Cache npm global packages
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-global-${{ hashFiles('.github/workflows/generate-pdf.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-npm-global-

            - name: Install Pandoc
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pandoc

            - name: Install LaTeX
              run: |
                  sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-lang-cyrillic

            # Install Chromium dependencies for mermaid-cli
            - name: Install Chromium dependencies
              run: |
                  sudo apt-get install -y \
                    chromium-browser \
                    libnss3 \
                    libatk1.0-0 \
                    libatk-bridge2.0-0 \
                    libcups2 \
                    libdrm2 \
                    libxkbcommon0 \
                    libxcomposite1 \
                    libxdamage1 \
                    libxfixes3 \
                    libxrandr2 \
                    libgbm1 \
                    libasound2

            - name: Install Mermaid Filter
              run: |
                  npm install -g @mermaid-js/mermaid-cli
                  npm install -g mermaid-filter
              env:
                  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                  PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

            - name: Create pdf-book directory
              run: mkdir -p pdf-book

            - name: Generate PDF
              run: |
                  chmod +x .github/scripts/build-pdf.sh
                  .github/scripts/build-pdf.sh

            - name: Commit and Push PDF
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add pdf-book/GCP-Associate-CE.pdf
                  git diff --staged --quiet || git commit -m "📚 Auto-generate PDF book [skip ci]"
                  git push
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
