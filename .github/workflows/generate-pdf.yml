name: Generate PDF Book

on:
    push:
        branches:
            - main
        paths-ignore:
            - "pdf-book/**"
            - ".agent/**"
            - ".github/workflows/**"

jobs:
    generate-pdf:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            # Cache APT packages
            - name: Cache APT packages
              uses: actions/cache@v4
              with:
                  path: |
                      /var/cache/apt/archives
                      /var/lib/apt/lists
                  key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/generate-pdf.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-apt-

            # Cache npm global packages
            - name: Cache npm global packages
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-global-${{ hashFiles('.github/workflows/generate-pdf.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-npm-global-

            # Cache Puppeteer Chromium
            - name: Cache Puppeteer Chromium
              uses: actions/cache@v4
              with:
                  path: ~/.cache/puppeteer
                  key: ${{ runner.os }}-puppeteer-${{ hashFiles('.github/workflows/generate-pdf.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-puppeteer-

            - name: Install Pandoc
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pandoc

            - name: Install LaTeX
              run: |
                  sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-fonts-extra texlive-lang-cyrillic

            # Install Puppeteer with Chromium for mermaid-cli
            - name: Install Puppeteer with Chromium
              run: |
                  npm install -g puppeteer

            - name: Install Mermaid Filter
              run: |
                  npm install -g @mermaid-js/mermaid-cli
                  npm install -g mermaid-filter

            # Patch mmdc to use --no-sandbox
            - name: Patch mmdc for CI
              run: |
                  MMDC_PATH=$(npm root -g)/mermaid-filter/node_modules/.bin/mmdc
                  MMDC_REAL=$(npm root -g)/mermaid-filter/node_modules/.bin/mmdc.real
                  mv "$MMDC_PATH" "$MMDC_REAL"
                  cat > "$MMDC_PATH" << 'EOF'
                  #!/bin/bash
                  exec "$(dirname "$0")/mmdc.real" --puppeteerConfigFile "$(pwd)/.github/scripts/mermaid-config.json" "$@"
                  EOF
                  chmod +x "$MMDC_PATH"

            - name: Create pdf-book directory
              run: mkdir -p pdf-book

            - name: Generate PDF
              run: |
                  chmod +x .github/scripts/build-pdf.sh
                  .github/scripts/build-pdf.sh
              env:
                  PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"
                  MERMAID_FILTER_PUPPETEER_CONFIG: .github/scripts/mermaid-config.json

            - name: Commit and Push PDF
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add pdf-book/GCP-Associate-CE.pdf
                  git diff --staged --quiet || git commit -m "📚 Auto-generate PDF book [skip ci]"
                  git push
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
