name: Documentation Quality Check

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    markdown-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "20"

            - name: Install dependencies
              run: |
                  npm install -g markdownlint-cli
                  npm install -g markdown-link-check
                  npm install -g @mermaid-js/mermaid-cli

            - name: Run markdownlint
              run: markdownlint '**/*.md' --config .markdownlint.json --ignore node_modules
              continue-on-error: false

            - name: Check internal links
              run: |
                  find . -name "*.md" -not -path "./node_modules/*" -exec markdown-link-check {} \; -exec echo {} \;
              continue-on-error: false

            - name: Validate repository structure
              run: |
                  chmod +x .github/scripts/validate-structure.sh
                  .github/scripts/validate-structure.sh

            - name: Validate Mermaid diagrams
              run: |
                  chmod +x .github/scripts/validate-mermaid.sh
                  .github/scripts/validate-mermaid.sh

            - name: Check exam questions format
              run: |
                  chmod +x .github/scripts/validate-exam-questions.sh
                  .github/scripts/validate-exam-questions.sh

            - name: Generate quality report
              if: always()
              run: |
                  echo "## Quality Check Results" >> $GITHUB_STEP_SUMMARY
                  echo "✅ All quality checks passed!" >> $GITHUB_STEP_SUMMARY
